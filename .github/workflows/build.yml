name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# only keep the latest run per branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (${{ matrix.preset }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [msvc-debug, msvc-release]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: "6.8.*"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -D "CMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        # qml_smoke needs a GPU-less QML render; the CI runner has no display.
        run: ctest --preset ${{ matrix.preset }} --output-on-failure -E qml_smoke

      - name: Verify deployment (windeployqt)
        run: |
          $exe = Get-ChildItem -Recurse -Filter AulaF75Studio.exe "${{ github.workspace }}\bin" | Select-Object -First 1 -ExpandProperty FullName
          $flag = if ("${{ matrix.preset }}" -eq "msvc-debug") { "--debug" } else { "--release" }
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" $flag --qmldir Views --no-translations $exe
